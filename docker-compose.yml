services:
  sami-translator:
    build: .
    container_name: sami-translator-gemini
    ports:
      - "8090:8090"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-4-hydrogen}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
